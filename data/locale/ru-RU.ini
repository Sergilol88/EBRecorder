EBRecorder.ToolsMenu="EB Recorder"
EBRecorder.Title="EB Recorder 0.3.2"
EBRecorder.Intro="Версия 0.3.2 записывает активный поток Enhanced Broadcasting с максимальным разрешением в устойчивый к аварийному завершению Matroska (MKV), повторно используя уже работающий EB-видеокодировщик и выбранные аудиодорожки Live/VOD. Запись можно запускать вручную или автоматически вместе с EB-трансляцией."
