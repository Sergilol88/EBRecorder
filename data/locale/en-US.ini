EBRecorder.Title="EB Recorder 0.3.1"
EBRecorder.Intro="Version 0.3.1 records the active highest-resolution Enhanced Broadcasting rendition to crash-resilient Matroska (MKV) by reusing the existing EB video and selected Live/VOD audio encoders. Recording can be started manually or automatically together with the EB stream."
